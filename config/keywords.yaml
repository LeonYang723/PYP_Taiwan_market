# 監控關鍵字設定
# 每個關鍵字都會各自呼叫一次蝦皮搜尋，抓取結果中的商品列表。
# 建議放入品牌名稱本身，以及常見的中文商品詞組合，涵蓋不同賣家可能的命名方式。
#
# 注意：蝦皮搜尋是全文比對，關鍵字越精準，噪音（不相關商品）越少。
# 上線後建議先跑一次，檢查 data/raw 底下抓回來的商品是否真的是 PYP 相關商品，
# 再回頭調整這份清單。

keywords:
  - "PYP"
  - "PYP 卡套"
  - "PYP 卡夾"
  - "PYP 保護套"
  - "PYP 卡片收納"

# 蝦皮站台，預設台灣站
site: "shopee.tw"

# 每個關鍵字最多抓幾頁（每頁 60 筆），避免對同一關鍵字抓太多不相關/太後面的搜尋結果
max_pages_per_keyword: 3

# 每次 API 請求之間的隨機延遲秒數區間（降低被判定為機器人的機率）
request_delay_seconds: [3, 7]

# 是否額外查詢每個賣家的名稱（預設關閉）。
# 打開後，每個「不重複賣家」都會多打一次 API 請求，請求量大幅增加，
# 也會提高被蝦皮封鎖的機率。若關閉，儀表板會用賣家 ID + 賣場連結取代賣家名稱，
# 需要看名稱時人工點連結進去看即可。建議先用預設關閉跑一陣子觀察穩定性，
# 有餘裕再考慮打開。
enrich_shop_names: false
